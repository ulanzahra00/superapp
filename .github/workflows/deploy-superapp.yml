name: Deploy Website ke public_html/superapp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Project SuperApp
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependency Laravel
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Siapkan paket deploy Laravel
        run: |
          set -e

          # Buat folder deploy
          mkdir -p deploy-package

          # Copy semua file kecuali yang tidak perlu
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='deploy-package/' \
            --exclude='database/exports/' \
            ./ deploy-package/

          # Pindahkan isi public/ ke root deploy
          cp -a public/. deploy-package/
          rm -rf deploy-package/public

          # Fix path index.php untuk hosting
          sed -i "s#__DIR__.'/../vendor/autoload.php'#__DIR__.'/vendor/autoload.php'#" deploy-package/index.php
          sed -i "s#__DIR__.'/../bootstrap/app.php'#__DIR__.'/bootstrap/app.php'#" deploy-package/index.php
          sed -i "s#__DIR__.'/../storage/framework/maintenance.php'#__DIR__.'/storage/framework/maintenance.php'#" deploy-package/index.php

          # Buat struktur storage
          mkdir -p deploy-package/storage/framework/cache/data
          mkdir -p deploy-package/storage/framework/sessions
          mkdir -p deploy-package/storage/framework/views
          mkdir -p deploy-package/storage/logs

      - name: Upload ke Server via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_TARGET_DIR: public_html/superapp
        run: |
          set -e

          # Install lftp tanpa update package list (pakai cached apt)
          sudo apt-get install -y --no-upgrade lftp 2>/dev/null || sudo apt-get update -qq && sudo apt-get install -y lftp

          # Upload dengan koneksi paralel lebih banyak
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 60
          set ftp:parallel 5
          set cmd:parallel 5
          set ftp:auto-passive-mode yes
          mkdir -p $FTP_TARGET_DIR
          mirror -R --verbose --parallel=10 deploy-package $FTP_TARGET_DIR
          bye
          EOF