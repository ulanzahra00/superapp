name: Deploy Website ke Hosting
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Project
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode dari GitHub
      uses: actions/checkout@v4

    - name: Upload folder public via FTP
      run: |
        set -e

        upload_file() {
          local file="$1"
          local remote_path="$2"
          echo "Uploading $file -> $remote_path"
          curl --fail --show-error --ftp-create-dirs \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --upload-file "$file" \
            "ftp://${{ secrets.FTP_SERVER }}:21/pgrikotamobagu.my.id/superapp/$remote_path"
        }

        find public -type f | while read -r file; do
          upload_file "$file" "${file#public/}"
        done
