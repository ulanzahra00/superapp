name: Deploy Website ke Hosting
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Project
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode dari GitHub
      uses: actions/checkout@v4

    - name: Upload via SFTP ke hosting
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: ${{ vars.FTP_PORT }}
        local_path: './*'
        remote_path: '/public_html/deploypengumuman'
