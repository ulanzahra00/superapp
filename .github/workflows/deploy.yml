name: Deploy Website ke Hosting
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Project
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode dari GitHub
      uses: actions/checkout@v4

    - name: Upload satu file tes via FTP
      run: |
        curl --fail --show-error --ftp-create-dirs \
          --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          --upload-file deploy-test/laravel-index-test.php \
          "ftp://${{ secrets.FTP_SERVER }}:21/public_html/superapp/laravel-index-test.php"
