name: Deploy Website ke Hosting
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Project
    runs-on: ubuntu-latest
    steps:
    - name: Ambil kode dari GitHub
      uses: actions/checkout@v4

    - name: Upload folder public via FTP
      run: |
        set -e
        curl --show-error --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          --quote "DELE /public_html/superapp/index.php" \
          "ftp://${{ secrets.FTP_SERVER }}:21/" || true
        curl --fail --show-error --ftp-create-dirs \
          --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          --upload-file public/index.php \
          "ftp://${{ secrets.FTP_SERVER }}:21/public_html/superapp/index-copy.php"
        find public -type f | while read -r file; do
          remote_path="${file#public/}"
          curl --fail --show-error --ftp-create-dirs \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --upload-file "$file" \
            "ftp://${{ secrets.FTP_SERVER }}:21/public_html/superapp/$remote_path"
        done
